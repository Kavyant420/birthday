  let bookData = {};
  try {

  const card       = document.getElementById('page-card');

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(p) {
    if (p === 0) {
      const title  = localStorage.getItem('mc_book_title_v4')  || 'Book and Quill';
      const author = localStorage.getItem('mc_book_author_v4') || 'Kavy';
      display.innerHTML = `

    } else {
      const text = bookData[p] !== undefined ? bookData[p] : (defaultText[p] || '');
      const ro   = signed ? ' readonly' : '';
      display.innerHTML = `
        <div class="inner-page">
          <div class="page-header-label">- Page ${p} -</div>
          <textarea class="page-textarea" id="page-ta" spellcheck="false"

        document.getElementById('page-ta').addEventListener('input', function() {
          bookData[cur] = this.value;
        });
      }
    }

  function updateNav() {
    btnPrev.disabled = cur <= 0;
    btnNext.disabled = cur >= TOTAL;
    counter.textContent = cur === 0 ? 'Cover' : `Page ${cur} of ${TOTAL}`;
    if (signed) {
      btnDone.textContent = '* Signed Book *';
      btnDone.classList.add('is-signed');
      btnDone.onclick = null;
    }
  }

  function saveTA() {
    const ta = document.getElementById('page-ta');
    if (ta && cur > 0) bookData[cur] = ta.value;
  }

  
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function flipTo(newPage, dir) {
    if (flipping) return;
    flipping = true;
    saveTA();

    const next    = dir === 'next';
    const outDeg  = next ? -90 : 90;
    const inDeg   = next ?  90 : -90;
    const outGrad = next
      ? 'linear-gradient(to left,  rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, transparent 80%)'
      : 'linear-gradient(to right, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, transparent 80%)';
    const inGrad  = next
      ? 'linear-gradient(to right, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, transparent 80%)'
      : 'linear-gradient(to left,  rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, transparent 80%)';

    card.style.transition   = 'transform 0.15s cubic-bezier(0.55,0,1,0.45)';
    card.style.transform    = `perspective(800px) rotateY(${outDeg}deg)`;
    shadow.style.transition = 'opacity 0.08s linear';
    shadow.style.background = outGrad;
    shadow.style.opacity    = '1';

    await wait(155);

    cur = newPage;
    render(cur);
    updateNav();

    card.style.transition   = 'none';
    card.style.transform    = `perspective(800px) rotateY(${inDeg}deg)`;
    shadow.style.transition = 'none';
    shadow.style.background = inGrad;

    void card.getBoundingClientRect(); 

    card.style.transition   = 'transform 0.15s cubic-bezier(0,0.55,0.45,1)';
    card.style.transform    = 'perspective(800px) rotateY(0deg)';
    shadow.style.transition = 'opacity 0.12s linear';
    shadow.style.opacity    = '0';

    await wait(155);

    card.style.transition = '';
    card.style.transform  = '';
    flipping = false;
  }

  function goNext() { if (!flipping && cur < TOTAL) flipTo(cur + 1, 'next'); }
  function goPrev() { if (!flipping && cur > 0)     flipTo(cur - 1, 'prev'); }

  
  document.addEventListener('keydown', e => {
    if (signPanel.classList.contains('open')) return;
    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goNext();
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goPrev();
  });


  function openSign()  { if (!signed) { signPanel.classList.add('open'); signIn.focus(); } }

  function signBook()  {

  }
